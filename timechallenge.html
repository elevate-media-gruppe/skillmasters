<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillmasters - Time-Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Skillmasters</h1>

    <nav>
        <a href="index.html">Grundgedanke</a>
        <a href="timechallenge.html" class="active">Time-Challenge</a>
        <a href="partner.html">Partner an Bord</a>
    </nav>

    <main style="text-align: center; width: 100%;">
        
        <!-- Status Anzeige -->
        <div id="status-box" style="margin: 20px; font-size: 1.2rem;">
            Bitte mit Twitch einloggen...
        </div>

        <!-- Der Challenge Button (Zentrales Element) -->
        <button id="challenge-btn">JETZT STARTEN</button>

        <!-- Die Rangliste -->
        <section style="margin-top: 50px; width: 90%; max-width: 500px; margin-left: auto; margin-right: auto;">
            <h2 style="border-bottom: 1px solid white;">LEADERBOARD</h2>
            <table id="leaderboard" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 1px solid #444;">
                        <th>Rang</th>
                        <th>Name</th>
                        <th>Zeit (s)</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Daten kommen via JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <script>
    // 1. Cookie auslesen, um den Twitch-Namen zu finden
    function getCookie(name) {
        let value = "; " + document.cookie;
        let parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
    }

    const twitchUser = getCookie("twitch_user");
    const status = document.getElementById('status-box');
    const btn = document.getElementById('challenge-btn');

    // 2. Login-Check
    if (!twitchUser) {
        status.innerHTML = '<a href="/functions/auth" style="color:white; text-decoration:underline;">Bitte mit Twitch einloggen, um teilzunehmen</a>';
        btn.disabled = true;
    } else {
        status.innerText = "Willkommen, " + decodeURIComponent(twitchUser) + "! Bereit für den Skill-Test?";
        btn.disabled = false;
    }

    // Timer-Logik (bleibt wie zuvor)
    let startTime;
    let isCounting = false;
    let countdownValue = 10;
    let timerInterval;

    btn.addEventListener('click', () => {
        if (!isCounting && btn.innerText === "JETZT STARTEN") {
            startCountdown();
        } else if (isCounting) {
            handleEarlyClick();
        } else if (btn.innerText === "KLICKEN!") {
            finishChallenge();
        }
    });

    function startCountdown() {
        isCounting = true;
        countdownValue = 10;
        btn.innerText = countdownValue;
        timerInterval = setInterval(() => {
            countdownValue--;
            if (countdownValue > 0) {
                btn.innerText = countdownValue;
            } else {
                clearInterval(timerInterval);
                btn.innerText = "KLICKEN!";
                btn.style.background = "#00ff00"; 
                startTime = performance.now();
                isCounting = false;
            }
        }, 1000);
    }

    function handleEarlyClick() {
        clearInterval(timerInterval);
        isCounting = false;
        btn.innerText = "FEHLSTART!";
        btn.style.background = "red";
        setTimeout(() => { resetButton(); }, 2000);
    }

    function finishChallenge() {
        const reactionTime = ((performance.now() - startTime) / 1000).toFixed(4);
        btn.disabled = true;
        btn.innerText = reactionTime + "s";
        status.innerText = "Speichere Ergebnis für " + twitchUser + "...";
        
        // Der nächste Schritt ist der POST an /functions/submit
    }

    function resetButton() {
        btn.innerText = "JETZT STARTEN";
        btn.style.background = "white";
        btn.disabled = false;
    }
    </script>
    

</body>
</html>
